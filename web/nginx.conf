server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        return 200 'ok\n';
        default_type text/plain;
    }

    # Mount the parent directory so atomic changes to current are visible.
    location /data/ {
        alias /srv/controlfreq/data/current/;
        default_type application/json;
        add_header Cache-Control "no-store" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
